name: Razync Pro Diagnostics

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Validate main imports
        run: python -c "import sqlalchemy, streamlit, pandas, plotly, supabase"
      - name: Check forbidden preview files
        run: |
          test ! -f preview_access.py
          test ! -f preview_app.py
