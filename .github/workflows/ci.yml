name: Razync Pro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar sintaxe
        run: python -m compileall -q -x '^./scripts/' .
      - name: Validar importações principais
        run: python -c "import sqlalchemy, streamlit, pandas, plotly, supabase"
      - name: Verificar arquivos proibidos
        run: |
          test ! -f preview_access.py
          test ! -f preview_app.py
          test "$(find .github/workflows -maxdepth 1 -name '*.yml' | wc -l)" -eq 2
