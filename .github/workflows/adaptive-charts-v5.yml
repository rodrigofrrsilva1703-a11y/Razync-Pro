name: Adaptive Charts V5
on:
  push:
    paths:
      - scripts/adaptive_charts_v5.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/adaptive_charts_v5.py
      - run: python -m py_compile app.py ui_system.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py ui_system.py
          git diff --cached --quiet || git commit -m "faz graficos acompanharem tema claro e escuro"
          git push
