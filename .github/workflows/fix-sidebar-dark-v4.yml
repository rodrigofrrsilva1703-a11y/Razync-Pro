name: Fix Sidebar Dark V4
on:
  push:
    paths:
      - scripts/fix_sidebar_dark_v4.py
      - .github/workflows/fix-sidebar-dark-v4.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_sidebar_dark_v4.py
      - run: python -m py_compile app.py ui_system.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py ui_system.py
          git diff --cached --quiet || git commit -m "corrige sidebar e tema escuro de forma definitiva"
          git push
