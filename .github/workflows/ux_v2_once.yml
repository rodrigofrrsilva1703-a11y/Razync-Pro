name: UX V2 one-shot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply UX V2 patch
        run: python scripts/ux_v2_cleanup.py
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish final change
        run: |
          rm -f scripts/ux_v2_cleanup.py .github/workflows/ux_v2_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "simplifica navegacao e modulariza configuracao"
          git push origin HEAD:main
