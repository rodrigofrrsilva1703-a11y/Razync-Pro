name: Apply MEI Upgrade

on:
  push:
    paths:
      - 'scripts/upgrade_mei_experience.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        run: python scripts/upgrade_mei_experience.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app.py; then
            git add app.py
            git commit -m "melhora dashboard e adiciona fluxo de caixa"
            git push
          fi
