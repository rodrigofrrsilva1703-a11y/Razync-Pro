name: Integrar fechamento e analise
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python scripts/upgrade_closing_analysis.py
      - name: Validar sintaxe
        run: python -m py_compile app.py business_tools.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || (git commit -m "integra fechamento mensal e analise financeira" && git push)
