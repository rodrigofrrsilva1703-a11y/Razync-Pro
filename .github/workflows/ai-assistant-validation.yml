name: Razync AI Assistant Validation

on:
  push:
    branches: [ai-assistant-v1]

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-assistant-v1
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply AI assistant integration
        run: python scripts/apply_ai_assistant_v1.py
      - name: Remove temporary validation files
        run: rm -f scripts/apply_ai_assistant_v1.py .github/workflows/ai-assistant-validation.yml
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Validate AI imports
        run: python -c "from ai_assistant import build_safe_business_context, ask_razync_ai; from assistant_workspace import render_ai_assistant"
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Publish validated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "integra Assistente Razync com IA OpenAI" || exit 0
          git push origin HEAD:ai-assistant-v1
