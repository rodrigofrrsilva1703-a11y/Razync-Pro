name: Fix SQLAlchemy URL V9
on:
  push:
    paths:
      - scripts/fix_sqlalchemy_url_object_v9.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_sqlalchemy_url_object_v9.py
      - run: python -m py_compile database.py app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.py
          git diff --cached --quiet || git commit -m "corrige objeto URL do SQLAlchemy no banco"
          git push
