name: Next Stage V7
on:
  push:
    paths:
      - scripts/next_stage_v7.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/next_stage_v7.py
      - run: python -m py_compile app.py database.py product_core.py onboarding_tools.py reconciliation_tools.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py database.py product_core.py
          git diff --cached --quiet || git commit -m "integra onboarding e conciliacao inteligente"
          git push
