name: UX V2 branch validation

on:
  push:
    branches: [ux-v2-navigation]

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply navigation migration
        run: python scripts/apply_ux_v2.py
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Publish validated branch
        run: |
          rm -f scripts/apply_ux_v2.py .github/workflows/ux-v2-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "aplica UX V2 na navegacao"
          git push origin HEAD:ux-v2-navigation
