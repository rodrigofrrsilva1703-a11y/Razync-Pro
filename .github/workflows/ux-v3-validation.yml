name: UX V3 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.head_ref == 'ux-v3-consolidation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v3-consolidation
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply UX V3 integration
        run: python scripts/apply_ux_v3.py
      - name: Remove temporary validation files
        run: rm -f scripts/apply_ux_v3.py .github/workflows/ux-v3-validation.yml
      - name: Validate syntax
        run: python -m compileall -q .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Publish validated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "aplica Financeiro e Fiscal V2 com modularizacao"
          git push origin HEAD:ux-v3-consolidation
