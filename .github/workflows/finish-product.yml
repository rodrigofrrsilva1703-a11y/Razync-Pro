name: Finalizar camada de produto
on:
  push:
    branches: [main]
    paths:
      - scripts/finish_product.py
      - backup_tools.py
permissions:
  contents: write
jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar acabamento
        run: python scripts/finish_product.py
      - name: Validar sintaxe
        run: python -m py_compile app.py product_core.py backup_tools.py
      - name: Publicar
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py product_core.py
          git diff --cached --quiet || (git commit -m "finaliza navegação, documentos, status e backup" && git push)
