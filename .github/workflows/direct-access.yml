name: Acesso direto de desenvolvimento
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          # Mantém acesso direto durante o desenvolvimento.
          a = s.index('def ensure_login() -> dict:')
          b = s.index('\ndef tx_df(', a)
          novo = '''def ensure_login() -> dict:\n    email = "dev@local"\n    password = "dev"\n    user = authenticate(email, password)\n    if not user:\n        create_user("Desenvolvimento", email, password)\n        user = authenticate(email, password)\n    if not user:\n        st.stop()\n    st.session_state.user = user\n    return user\n\n'''
          s = s[:a] + novo + s[b+1:]

          # Corrige navegação: não altera diretamente a chave do st.radio após renderização.
          sidebar_marker = '''with st.sidebar:\n    st.markdown('<div class="rz-brand">RAZYNC <span>PRO</span></div>', unsafe_allow_html=True)'''
          if 'st.session_state.pop("_navigate_to"' not in s:
              s = s.replace(
                  sidebar_marker,
                  '''pending_page = st.session_state.pop("_navigate_to", None)\nif pending_page:\n    st.session_state["nav_page"] = pending_page\n\n''' + sidebar_marker,
                  1,
              )

          replacements = {
              'if q1.button("+ Lançamento", use_container_width=True): st.session_state.nav_page="Movimentações"; st.rerun()': 'if q1.button("+ Lançamento", use_container_width=True): st.session_state["_navigate_to"]="Movimentações"; st.rerun()',
              'if q2.button("Importar extrato", use_container_width=True): st.session_state.nav_page="Importar Extrato"; st.rerun()': 'if q2.button("Importar extrato", use_container_width=True): st.session_state["_navigate_to"]="Importar Extrato"; st.rerun()',
              'if q3.button("Ver DAS", use_container_width=True): st.session_state.nav_page="DAS"; st.rerun()': 'if q3.button("Ver DAS", use_container_width=True): st.session_state["_navigate_to"]="DAS"; st.rerun()',
              'if q4.button("Obrigações", use_container_width=True): st.session_state.nav_page="Obrigações"; st.rerun()': 'if q4.button("Obrigações", use_container_width=True): st.session_state["_navigate_to"]="Obrigações"; st.rerun()',
              'st.session_state.nav_page="Movimentações"\n                    st.rerun()': 'st.session_state["_navigate_to"]="Movimentações"\n                    st.rerun()',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || (git commit -m "corrige navegação dos atalhos" && git push)
