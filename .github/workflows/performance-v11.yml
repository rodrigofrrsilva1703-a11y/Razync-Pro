name: Performance V11
on:
  push:
    paths:
      - scripts/performance_v11_safe_cache.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/performance_v11_safe_cache.py
      - run: python -m py_compile database.py app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.py
          git diff --cached --quiet || git commit -m "otimiza consultas sem alterar regras do sistema"
          git push
