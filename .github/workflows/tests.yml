name: Razync Pro CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: razync-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Validate main imports
        run: python -c "import sqlalchemy, streamlit, pandas, plotly, supabase"
      - name: Check forbidden preview files
        run: |
          test ! -f preview_access.py
          test ! -f preview_app.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
