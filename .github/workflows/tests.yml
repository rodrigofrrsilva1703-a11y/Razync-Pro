name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Performance V16
        if: github.event_name == 'push'
        run: python scripts/performance_v16_patch.py
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish Performance V16 and restore workflow
        if: github.event_name == 'push'
        run: |
          git checkout HEAD^ -- .github/workflows/tests.yml
          rm -f scripts/performance_v16_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No V16 changes to publish"
          else
            git commit -m "aplica Performance V16 recorrencias sem rerun remoto"
            git push origin HEAD:main
          fi
