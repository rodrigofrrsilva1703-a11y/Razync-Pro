name: Razync Pro CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply UX V2 navigation patch
        if: github.event_name == 'push'
        run: python scripts/ux_v2_cleanup.py
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Validate main imports
        run: python -c "import sqlalchemy, streamlit, pandas, plotly, supabase"
      - name: Check forbidden preview files
        run: |
          test ! -f preview_access.py
          test ! -f preview_app.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish validated UX V2
        if: github.event_name == 'push'
        run: |
          git checkout HEAD^ -- .github/workflows/tests.yml
          rm -f scripts/ux_v2_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No UX changes to publish"
          else
            git commit -m "simplifica navegacao e modulariza configuracao"
            git push origin HEAD:main
          fi
