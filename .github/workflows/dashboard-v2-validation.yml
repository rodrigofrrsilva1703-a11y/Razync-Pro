name: Dashboard V2 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-publish:
    if: github.head_ref == 'dashboard-v2-experience' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-v2-experience
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply Dashboard V2
        run: python scripts/apply_dashboard_v2.py
      - name: Remove temporary validation files
        run: rm -f scripts/apply_dashboard_v2.py .github/workflows/dashboard-v2-validation.yml
      - name: Validate syntax
        run: python -m compileall -q -x '^./scripts/' .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish validated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "aplica Dashboard V2 e simplifica experiencia inicial"
          git push origin HEAD:dashboard-v2-experience
