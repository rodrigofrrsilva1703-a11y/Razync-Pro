name: UX Pass V6
on:
  push:
    paths:
      - scripts/ux_pass_v6.py
      - .github/workflows/ux-pass-v6.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ux_pass_v6.py
      - run: python -m py_compile app.py ui_system.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py ui_system.py
          git diff --cached --quiet || git commit -m "padroniza telas formularios e estados vazios"
          git push
