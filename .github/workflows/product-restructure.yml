name: Reestruturar Razync Pro
on:
  push:
    branches: [main]
    paths:
      - scripts/restructure_product.py
      - product_core.py
      - reports.py
permissions:
  contents: write
jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar reestruturação
        run: python scripts/restructure_product.py
      - name: Validar sintaxe
        run: python -m py_compile app.py product_core.py reports.py
      - name: Publicar
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app.py
          git diff --cached --quiet || (git commit -m "reestrutura navegação e centrais do Razync Pro" && git push)
