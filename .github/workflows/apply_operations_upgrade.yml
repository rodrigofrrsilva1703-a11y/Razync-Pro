name: Apply operations upgrade

on:
  push:
    paths:
      - 'scripts/upgrade_operations.py'
      - '.github/workflows/apply_operations_upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/upgrade_operations.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "integra extratos e obrigações automáticas"
          git push
