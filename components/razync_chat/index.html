<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{--bg:#fff;--surface:#fff;--soft:#f5f7f9;--border:#e1e7eb;--text:#14212b;--muted:#71808c;--primary:#0788ad;--user:#e7f4fa;--shadow:0 16px 42px rgba(17,38,50,.13)}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body.dark{--bg:#11171b;--surface:#171e23;--soft:#20292f;--border:#2b363e;--text:#f2f5f7;--muted:#9aa8b2;--primary:#14a7cd;--user:#173b48;--shadow:0 18px 46px rgba(0,0,0,.34)}
.chat{height:540px;width:100%;display:grid;grid-template-rows:54px minmax(0,1fr) 62px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#06283a,var(--primary));color:#fff;font-size:10px;font-weight:800;flex:0 0 32px}.identity{min-width:0;flex:1}.identity strong{display:block;font-size:13px;line-height:1.15}.identity span{display:flex;align-items:center;gap:5px;margin-top:3px;color:var(--muted);font-size:10px}.dot{width:6px;height:6px;border-radius:50%;background:#22b573}.iconbtn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}.iconbtn:hover{background:var(--soft);color:var(--text)}
.thread{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 16px;background:var(--bg);scrollbar-width:thin;scrollbar-color:#c7d0d6 transparent}.thread::-webkit-scrollbar{width:4px}.thread::-webkit-scrollbar-thumb{background:#c7d0d6;border-radius:999px}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);font-size:12px;line-height:1.45}
.row{display:flex;width:100%;margin:0 0 10px}.row.assistant{justify-content:flex-start}.row.user{justify-content:flex-end}.bubble{max-width:86%;font-size:12.5px;line-height:1.48;overflow-wrap:anywhere;white-space:pre-wrap}.assistant .bubble{max-width:94%;padding:2px 2px;background:transparent}.user .bubble{padding:8px 10px;border-radius:14px 14px 4px 14px;background:var(--user)}.typing{display:flex;gap:4px;align-items:center;height:20px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:pulse 1.15s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}@keyframes pulse{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.quick-actions{margin:4px 0 14px}.quick-title{margin:0 0 7px;color:var(--muted);font-size:10.5px;font-weight:600}.quick-grid{display:flex;flex-wrap:wrap;gap:6px}.quick-btn{border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);padding:7px 10px;font:inherit;font-size:11px;cursor:pointer}.quick-btn:hover{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--surface))}
.action-card{margin:4px 0 14px;padding:11px;border:1px solid color-mix(in srgb,var(--primary) 30%,var(--border));border-radius:13px;background:color-mix(in srgb,var(--primary) 5%,var(--surface))}.action-kicker{color:var(--primary);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.action-title{margin-top:3px;font-size:12.5px;font-weight:700}.action-summary{margin-top:5px;font-size:11.5px;line-height:1.4}.action-missing{margin-top:6px;color:var(--muted);font-size:10.5px;line-height:1.35}.action-buttons{display:flex;gap:7px;margin-top:10px}.action-btn{flex:1;min-height:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:10.5px;font-weight:650;cursor:pointer}.action-btn.primary{border-color:var(--primary);background:var(--primary);color:#fff}.action-btn:hover{filter:brightness(.97)}.action-btn:disabled{opacity:.45;cursor:default}
.composer{display:flex;align-items:flex-end;gap:8px;padding:9px 10px;border-top:1px solid var(--border);background:var(--surface)}.inputwrap{flex:1;min-width:0;display:flex;align-items:center;min-height:42px;border:1px solid var(--border);border-radius:13px;background:var(--soft);padding:5px 8px 5px 10px}.inputwrap:focus-within{border-color:color-mix(in srgb,var(--primary) 70%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 10%,transparent)}textarea{width:100%;max-height:84px;min-height:28px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:12px;line-height:1.4;padding:5px 0}textarea::placeholder{color:var(--muted)}.send{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:15px}.send:disabled{opacity:.45;cursor:default}.send:hover:not(:disabled){filter:brightness(.96)}
@media(max-width:420px){.chat{height:500px;border-radius:14px}.bubble{font-size:12px}.thread{padding:12px 10px}.composer{padding:8px}}
</style>
</head>
<body>
<div class="chat" id="chat">
  <header class="head">
    <div class="avatar">RZ</div>
    <div class="identity"><strong id="title">Razync</strong><span><b class="dot"></b><span id="subtitle">Assistente online</span></span></div>
    <button class="iconbtn" id="openFull" title="Abrir conversa completa" aria-label="Abrir conversa completa">↗</button>
    <button class="iconbtn" id="close" title="Fechar" aria-label="Fechar">×</button>
  </header>
  <main class="thread" id="thread"></main>
  <footer class="composer">
    <div class="inputwrap"><textarea id="input" rows="1" placeholder="Pergunte ao Razync..."></textarea></div>
    <button class="send" id="send" aria-label="Enviar">➤</button>
  </footer>
</div>
<script>
const SET_COMPONENT_VALUE="streamlit:setComponentValue",RENDER="streamlit:render",COMPONENT_READY="streamlit:componentReady",SET_FRAME_HEIGHT="streamlit:setFrameHeight";
function sendMessage(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data||{}),"*")}
function notify(value){sendMessage(SET_COMPONENT_VALUE,{value:value,dataType:"json"})}
function frameHeight(h){sendMessage(SET_FRAME_HEIGHT,{height:h})}
function eventId(){return `${Date.now()}-${Math.random().toString(16).slice(2)}`}
const thread=document.getElementById("thread"),input=document.getElementById("input"),send=document.getElementById("send");
let loading=false,lastRenderKey="";
function addRow(role,text){const row=document.createElement("div");row.className=`row ${role}`;const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=String(text||"");row.appendChild(bubble);thread.appendChild(row)}
function addTyping(){const row=document.createElement("div");row.className="row assistant";const bubble=document.createElement("div");bubble.className="bubble typing";bubble.innerHTML="<i></i><i></i><i></i>";row.appendChild(bubble);thread.appendChild(row)}
function lockChat(){loading=true;send.disabled=true;input.disabled=true;thread.querySelectorAll("button").forEach(button=>button.disabled=true)}
function actionButton(label,action,primary=false){const button=document.createElement("button");button.className=`action-btn${primary?" primary":""}`;button.textContent=label;button.disabled=loading;button.addEventListener("click",()=>{lockChat();addTyping();thread.scrollTop=thread.scrollHeight;notify({action:action,event_id:eventId()})});return button}
function addQuickActions(actions){if(!actions.length||loading)return;const wrap=document.createElement("section");wrap.className="quick-actions";const title=document.createElement("p");title.className="quick-title";title.textContent="O que você quer fazer?";wrap.appendChild(title);const grid=document.createElement("div");grid.className="quick-grid";actions.forEach(item=>{if(!item||!item.label||!item.prompt)return;const button=document.createElement("button");button.className="quick-btn";button.textContent=String(item.label);button.addEventListener("click",()=>dispatchPrompt(String(item.prompt),"quick_prompt"));grid.appendChild(button)});wrap.appendChild(grid);thread.appendChild(wrap)}
function addActionCard(card){if(!card)return;const wrap=document.createElement("section");wrap.className="action-card";const kicker=document.createElement("div");kicker.className="action-kicker";kicker.textContent="Ação da IA";wrap.appendChild(kicker);const title=document.createElement("div");title.className="action-title";title.textContent=String(card.title||"Ação preparada");wrap.appendChild(title);const summary=document.createElement("div");summary.className="action-summary";summary.textContent=String(card.summary||"Confira os dados antes de continuar.");wrap.appendChild(summary);const missing=Array.isArray(card.missing)?card.missing:[];if(missing.length){const note=document.createElement("div");note.className="action-missing";note.textContent=`Falta informar: ${missing.join(", ")}.`;wrap.appendChild(note)}const buttons=document.createElement("div");buttons.className="action-buttons";if(card.ready){buttons.appendChild(actionButton("Cancelar","cancel_action"));buttons.appendChild(actionButton("Confirmar e salvar","confirm_action",true))}else{buttons.appendChild(actionButton("Cancelar","cancel_action"));buttons.appendChild(actionButton("Completar dados","review_action",true))}wrap.appendChild(buttons);thread.appendChild(wrap)}
function render(args){
  const theme=args.theme==="dark"?"dark":"light";document.body.className=theme;
  document.getElementById("title").textContent=args.title||"Razync";document.getElementById("subtitle").textContent=args.subtitle||"Assistente online";input.placeholder=args.placeholder||"Pergunte ao Razync...";
  loading=!!args.is_loading;send.disabled=loading;input.disabled=loading;
  const messages=Array.isArray(args.messages)?args.messages:[],quickActions=Array.isArray(args.quick_actions)?args.quick_actions:[],actionCard=args.action_card||null;const key=JSON.stringify([messages,loading,theme,quickActions,actionCard]);
  if(key!==lastRenderKey){thread.innerHTML="";messages.slice(-30).forEach(m=>addRow(m&&m.role==="user"?"user":"assistant",m&&m.content?m.content:""));if(actionCard)addActionCard(actionCard);else addQuickActions(quickActions);if(loading)addTyping();thread.scrollTop=thread.scrollHeight;lastRenderKey=key}
  frameHeight(window.innerWidth<=420?500:540);
}
function dispatchPrompt(text,action="send"){
  if(!text||loading)return;lockChat();
  const quick=thread.querySelector(".quick-actions");if(quick)quick.remove();
  addRow("user",text);addTyping();thread.scrollTop=thread.scrollHeight;
  input.value="";autoSize();notify({action:action,text:text,event_id:eventId()});
}
function submit(){dispatchPrompt(input.value.trim())}
function autoSize(){input.style.height="28px";input.style.height=Math.min(input.scrollHeight,84)+"px"}
send.addEventListener("click",submit);input.addEventListener("input",autoSize);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit()}});
document.getElementById("close").addEventListener("click",()=>notify({action:"close",event_id:eventId()}));
document.getElementById("openFull").addEventListener("click",()=>notify({action:"open_full",event_id:eventId()}));
window.addEventListener("message",event=>{if(event.data&&event.data.type===RENDER)render(event.data.args||{})});
sendMessage(COMPONENT_READY,{apiVersion:1});window.addEventListener("load",()=>frameHeight(window.innerWidth<=420?500:540));
</script>
</body>
</html>
