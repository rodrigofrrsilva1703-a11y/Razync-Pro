<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root{--bg:#fff;--surface:#fff;--soft:#f5f7f9;--border:#e1e7eb;--text:#14212b;--muted:#71808c;--primary:#0788ad;--user:#e7f4fa;--shadow:0 16px 42px rgba(17,38,50,.13)}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body.dark{--bg:#11171b;--surface:#171e23;--soft:#20292f;--border:#2b363e;--text:#f2f5f7;--muted:#9aa8b2;--primary:#14a7cd;--user:#173b48;--shadow:0 18px 46px rgba(0,0,0,.34)}
.chat{height:540px;width:100%;display:grid;grid-template-rows:54px minmax(0,1fr) 62px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#06283a,var(--primary));color:#fff;font-size:10px;font-weight:800;flex:0 0 32px}.identity{min-width:0;flex:1}.identity strong{display:block;font-size:13px;line-height:1.15}.identity span{display:flex;align-items:center;gap:5px;margin-top:3px;color:var(--muted);font-size:10px}.dot{width:6px;height:6px;border-radius:50%;background:#22b573}.iconbtn{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}.iconbtn:hover{background:var(--soft);color:var(--text)}
.thread{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 16px;background:var(--bg);scrollbar-width:thin;scrollbar-color:#c7d0d6 transparent}.thread::-webkit-scrollbar{width:4px}.thread::-webkit-scrollbar-thumb{background:#c7d0d6;border-radius:999px}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);font-size:12px;line-height:1.45}
.row{display:flex;width:100%;margin:0 0 10px}.row.assistant{justify-content:flex-start}.row.user{justify-content:flex-end}.bubble{max-width:86%;font-size:12.5px;line-height:1.48;overflow-wrap:anywhere;white-space:pre-wrap}.assistant .bubble{max-width:94%;padding:2px 2px;background:transparent}.user .bubble{padding:8px 10px;border-radius:14px 14px 4px 14px;background:var(--user)}.bubble strong{font-weight:700}.bubble em{font-style:italic}.bubble code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.94em;background:var(--soft);border-radius:4px;padding:1px 3px}.bubble a{color:var(--primary);text-decoration:none}.bubble a:hover{text-decoration:underline}.typing{display:flex;gap:4px;align-items:center;height:20px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:pulse 1.15s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}@keyframes pulse{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.quick-actions{margin:4px 0 14px}.quick-title{margin:0 0 7px;color:var(--muted);font-size:10.5px;font-weight:600}.quick-grid{display:flex;flex-wrap:wrap;gap:6px}.quick-btn{border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);padding:7px 10px;font:inherit;font-size:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.quick-btn:hover{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--surface))}
.action-card{margin:4px 0 14px;padding:11px;border:1px solid color-mix(in srgb,var(--primary) 30%,var(--border));border-radius:13px;background:color-mix(in srgb,var(--primary) 5%,var(--surface))}.action-kicker{color:var(--primary);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.action-title{margin-top:3px;font-size:12.5px;font-weight:700}.action-summary{margin-top:5px;font-size:11.5px;line-height:1.4}.action-missing{margin-top:6px;color:var(--muted);font-size:10.5px;line-height:1.35}.action-buttons{display:flex;gap:7px;margin-top:10px}.action-btn{flex:1;min-height:34px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:10.5px;font-weight:650;cursor:pointer}.action-btn.primary{border-color:var(--primary);background:var(--primary);color:#fff}.action-btn:hover{filter:brightness(.97)}.action-btn:disabled{opacity:.45;cursor:default}
.action-fields{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.action-field{display:flex;flex-direction:column;gap:3px}.action-field.wide{grid-column:1/-1}.action-field label{color:var(--muted);font-size:9.5px}.action-field input,.action-field select{width:100%;min-width:0;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:0 8px;font:inherit;font-size:10.5px;outline:0}.action-field input:focus,.action-field select:focus{border-color:var(--primary)}
.receipt-card{margin:4px 0 12px;padding:10px 11px;border:1px solid #a9dfc7;border-radius:13px;background:color-mix(in srgb,#22a66f 7%,var(--surface))}.receipt-kicker{color:#168157;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.receipt-summary{margin-top:4px;font-size:11.5px;font-weight:650;line-height:1.35}.receipt-message{margin-top:3px;color:var(--muted);font-size:10px}.receipt-actions{display:flex;gap:6px;margin-top:8px}
.feedback{display:flex;align-items:center;gap:5px;margin:0 0 12px 2px;color:var(--muted);font-size:9.5px}.feedback button{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);padding:4px 7px;font:inherit;cursor:pointer}.feedback button:hover{border-color:var(--primary);color:var(--primary)}
.composer{display:flex;align-items:flex-end;gap:6px;padding:9px 10px;border-top:1px solid var(--border);background:var(--surface)}.inputwrap{flex:1;min-width:0;display:flex;align-items:center;min-height:42px;border:1px solid var(--border);border-radius:13px;background:var(--soft);padding:5px 8px 5px 10px}.inputwrap:focus-within{border-color:color-mix(in srgb,var(--primary) 70%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 10%,transparent)}textarea{width:100%;max-height:84px;min-height:28px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:12px;line-height:1.4;padding:5px 0}textarea::placeholder{color:var(--muted)}.send,.toolbtn{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:15px}.send{background:var(--primary);color:#fff}.toolbtn{width:34px;flex-basis:34px;background:transparent;color:var(--muted);font-size:16px}.toolbtn:hover{background:var(--soft);color:var(--primary)}.send:disabled,.toolbtn:disabled{opacity:.45;cursor:default}.send:hover:not(:disabled){filter:brightness(.96)}.hidden-file{display:none}
@media(max-width:420px){.chat{height:500px;border-radius:14px}.bubble{font-size:12px}.thread{padding:12px 10px}.composer{padding:8px}}
</style>
</head>
<body>
<div class="chat" id="chat">
  <header class="head">
    <div class="avatar">RZ</div>
    <div class="identity"><strong id="title">Razync</strong><span><b class="dot"></b><span id="subtitle">Assistente online</span></span></div>
    <button class="iconbtn" id="openFull" title="Abrir conversa completa" aria-label="Abrir conversa completa">↗</button>
    <button class="iconbtn" id="close" title="Fechar" aria-label="Fechar">×</button>
  </header>
  <main class="thread" id="thread"></main>
  <footer class="composer">
    <button class="toolbtn" id="attach" title="Enviar documento" aria-label="Enviar documento">⌕</button>
    <input class="hidden-file" id="documentFile" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" />
    <div class="inputwrap"><textarea id="input" rows="1" placeholder="Pergunte ao Razync..."></textarea></div>
    <button class="toolbtn" id="audio" title="Enviar áudio para transcrição" aria-label="Enviar áudio para transcrição">●</button>
    <input class="hidden-file" id="audioFile" type="file" accept="audio/*,.webm,.m4a,.mp3,.wav,.ogg" capture="user" />
    <button class="send" id="send" aria-label="Enviar">➤</button>
  </footer>
</div>
<script>
const SET_COMPONENT_VALUE="streamlit:setComponentValue",RENDER="streamlit:render",COMPONENT_READY="streamlit:componentReady",SET_FRAME_HEIGHT="streamlit:setFrameHeight";
function sendMessage(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data||{}),"*")}
function notify(value){sendMessage(SET_COMPONENT_VALUE,{value:value,dataType:"json"})}
function frameHeight(h){sendMessage(SET_FRAME_HEIGHT,{height:h})}
function eventId(){return `${Date.now()}-${Math.random().toString(16).slice(2)}`}
const thread=document.getElementById("thread"),input=document.getElementById("input"),send=document.getElementById("send"),attach=document.getElementById("attach"),audio=document.getElementById("audio"),documentFile=document.getElementById("documentFile"),audioFile=document.getElementById("audioFile");
let loading=false,lastRenderKey="",maxDocumentBytes=6*1024*1024,maxAudioBytes=10*1024*1024;
function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function safeInline(value){let text=escapeHtml(value);text=text.replace(/`([^`]+)`/g,"<code>$1</code>");text=text.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");text=text.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');return text}
function renderMarkdown(value){const lines=String(value||"").replace(/\r\n?/g,"\n").split("\n");return lines.map(line=>{const heading=line.match(/^#{1,4}\s+(.+)$/);if(heading)return `<strong>${safeInline(heading[1])}</strong>`;const bullet=line.match(/^\s*[-*]\s+(.+)$/);if(bullet)return `• ${safeInline(bullet[1])}`;const numbered=line.match(/^\s*(\d+)\.\s+(.+)$/);if(numbered)return `${numbered[1]}. ${safeInline(numbered[2])}`;return safeInline(line)}).join("<br>")}
function addRow(role,text){const row=document.createElement("div");row.className=`row ${role}`;const bubble=document.createElement("div");bubble.className="bubble";if(role==="assistant")bubble.innerHTML=renderMarkdown(text);else bubble.textContent=String(text||"");row.appendChild(bubble);thread.appendChild(row)}
function addTyping(){const row=document.createElement("div");row.className="row assistant";const bubble=document.createElement("div");bubble.className="bubble typing";bubble.innerHTML="<i></i><i></i><i></i>";row.appendChild(bubble);thread.appendChild(row)}
function lockChat(){loading=true;send.disabled=true;attach.disabled=true;audio.disabled=true;input.disabled=true;thread.querySelectorAll("button").forEach(button=>button.disabled=true)}
function showClientMessage(text){addRow("assistant",text);thread.scrollTop=thread.scrollHeight}
function actionButton(label,action,primary=false){const button=document.createElement("button");button.className=`action-btn${primary?" primary":""}`;button.textContent=label;button.disabled=loading;button.addEventListener("click",()=>{lockChat();addTyping();thread.scrollTop=thread.scrollHeight;notify({action:action,event_id:eventId()})});return button}
function dispatchPrompt(text,action="send"){const value=String(text||"").trim();if(!value||loading)return;addRow("user",value);addTyping();thread.scrollTop=thread.scrollHeight;lockChat();notify({action:action,text:value,event_id:eventId()});input.value="";autoSize()}
function addQuickActions(actions){if(!actions.length||loading)return;const wrap=document.createElement("section");wrap.className="quick-actions";const title=document.createElement("p");title.className="quick-title";title.textContent="O que você quer fazer?";wrap.appendChild(title);const grid=document.createElement("div");grid.className="quick-grid";actions.forEach(item=>{if(!item||!item.label||!item.prompt)return;const button=document.createElement("button");button.className="quick-btn";button.textContent=String(item.label);button.addEventListener("click",()=>dispatchPrompt(String(item.prompt),"quick_prompt"));grid.appendChild(button)});wrap.appendChild(grid);thread.appendChild(wrap)}
function addResources(resources){if(!resources)return;const downloads=Array.isArray(resources.downloads)?resources.downloads:[];const note=String(resources.note||"").trim();const route=String(resources.route||"").trim();if(!downloads.length&&!note&&!route)return;const wrap=document.createElement("section");wrap.className="quick-actions";if(downloads.length){const title=document.createElement("p");title.className="quick-title";title.textContent="Arquivos preparados pelo Razync";wrap.appendChild(title);const grid=document.createElement("div");grid.className="quick-grid";downloads.forEach(asset=>{if(!asset||!asset.href)return;const link=document.createElement("a");link.className="quick-btn";link.href=String(asset.href);link.download=String(asset.file_name||"arquivo");link.textContent=String(asset.label||"Baixar arquivo");grid.appendChild(link)});wrap.appendChild(grid)}if(note){const noteEl=document.createElement("div");noteEl.className="action-missing";noteEl.textContent=note;wrap.appendChild(noteEl)}if(route){const grid=wrap.querySelector(".quick-grid")||document.createElement("div");if(!grid.parentNode){grid.className="quick-grid";wrap.appendChild(grid)}const button=document.createElement("button");button.className="quick-btn";button.textContent=String(resources.route_label||"Abrir no Razync");button.addEventListener("click",()=>notify({action:"open_resource_route",event_id:eventId()}));grid.appendChild(button)}thread.appendChild(wrap)}
function addActionCard(card){if(!card)return;const wrap=document.createElement("section");wrap.className="action-card";const kicker=document.createElement("div");kicker.className="action-kicker";kicker.textContent="Ação da IA";wrap.appendChild(kicker);const title=document.createElement("div");title.className="action-title";title.textContent=String(card.title||"Ação preparada");wrap.appendChild(title);const summary=document.createElement("div");summary.className="action-summary";summary.textContent=String(card.summary||"Confira os dados antes de continuar.");wrap.appendChild(summary);const missing=Array.isArray(card.missing)?card.missing:[];if(missing.length){const note=document.createElement("div");note.className="action-missing";note.textContent=`Falta informar: ${missing.join(", ")}.`;wrap.appendChild(note)}const fields=Array.isArray(card.fields)?card.fields:[];if(fields.length){const form=document.createElement("div");form.className="action-fields";fields.forEach(field=>{const box=document.createElement("div");box.className=`action-field${field.key==="description"||field.key==="title"?" wide":""}`;const label=document.createElement("label");label.textContent=String(field.label||field.key);let control;if(field.type==="select"){control=document.createElement("select");(field.options||[]).forEach(option=>{const element=document.createElement("option");element.value=String(option);element.textContent=String(option);control.appendChild(element)})}else{control=document.createElement("input");control.type=field.type||"text";if(control.type==="number"){control.min="0";control.step="0.01"}}control.dataset.actionKey=String(field.key);control.value=String(field.value??"");box.appendChild(label);box.appendChild(control);form.appendChild(box)});wrap.appendChild(form)}const buttons=document.createElement("div");buttons.className="action-buttons";buttons.appendChild(actionButton("Cancelar","cancel_action"));const update=document.createElement("button");update.className="action-btn";update.textContent="Atualizar";update.addEventListener("click",()=>{const values={};wrap.querySelectorAll("[data-action-key]").forEach(field=>values[field.dataset.actionKey]=field.value);lockChat();notify({action:"update_action",values:values,event_id:eventId()})});if(fields.length)buttons.appendChild(update);if(card.ready)buttons.appendChild(actionButton("Salvar","confirm_action",true));wrap.appendChild(buttons);thread.appendChild(wrap)}
function addReceiptCard(card){if(!card)return;const wrap=document.createElement("section");wrap.className="receipt-card";const kicker=document.createElement("div");kicker.className="receipt-kicker";kicker.textContent=String(card.title||"Ação concluída");wrap.appendChild(kicker);const summary=document.createElement("div");summary.className="receipt-summary";summary.textContent=String(card.summary||"");wrap.appendChild(summary);const message=document.createElement("div");message.className="receipt-message";message.textContent=String(card.message||"");wrap.appendChild(message);const actions=document.createElement("div");actions.className="receipt-actions";if(card.can_open)actions.appendChild(actionButton(card.route_label||"Abrir","open_receipt"));if(card.can_undo)actions.appendChild(actionButton("Desfazer","undo_action"));if(actions.children.length)wrap.appendChild(actions);thread.appendChild(wrap)}
function addFeedback(){const wrap=document.createElement("div");wrap.className="feedback";const label=document.createElement("span");label.textContent="Resolveu?";wrap.appendChild(label);[["Sim","feedback_yes"],["Não","feedback_no"]].forEach(([text,action])=>{const button=document.createElement("button");button.textContent=text;button.addEventListener("click",()=>{button.parentElement.innerHTML="Obrigado pela avaliação.";notify({action:action,event_id:eventId()})});wrap.appendChild(button)});thread.appendChild(wrap)}
function render(args){const theme=args.theme==="dark"?"dark":"light";document.body.className=theme;document.getElementById("title").textContent=args.title||"Razync";document.getElementById("subtitle").textContent=args.subtitle||"Assistente online";input.placeholder=args.placeholder||"Pergunte ao Razync...";loading=!!args.is_loading;maxDocumentBytes=Number(args.max_document_bytes)||maxDocumentBytes;maxAudioBytes=Number(args.max_audio_bytes)||maxAudioBytes;send.disabled=loading;attach.disabled=loading;audio.disabled=loading;input.disabled=loading;const messages=Array.isArray(args.messages)?args.messages:[],quickActions=Array.isArray(args.quick_actions)?args.quick_actions:[],actionCard=args.action_card||null,receiptCard=args.receipt_card||null,resources=args.resources||null,feedbackEnabled=!!args.feedback_enabled;const key=JSON.stringify([messages,loading,theme,quickActions,actionCard,receiptCard,resources,feedbackEnabled]);if(key!==lastRenderKey){thread.innerHTML="";if(messages.length===0&&!loading){const empty=document.createElement("div");empty.className="empty";empty.textContent="Olá! Posso ajudar com cadastros, financeiro, documentos, relatórios e outras ferramentas do Razync.";thread.appendChild(empty)}else{messages.slice(-30).forEach(m=>addRow(m&&m.role==="user"?"user":"assistant",m&&m.content?m.content:""));if(feedbackEnabled&&messages.length&&!actionCard)addFeedback();if(loading)addTyping()}addResources(resources);addActionCard(actionCard);addReceiptCard(receiptCard);addQuickActions(quickActions);thread.scrollTop=thread.scrollHeight;lastRenderKey=key}syncFrameHeight()}
function autoSize(){input.style.height="28px";input.style.height=Math.min(input.scrollHeight,84)+"px"}
function syncFrameHeight(){const mobile=window.innerWidth<=420;const desired=mobile?500:540;const available=Math.max(360,Math.min(desired,window.parent&&window.parent.innerHeight?window.parent.innerHeight-16:desired));document.getElementById("chat").style.height=`${available}px`;frameHeight(available)}
function readFile(file,action,maxBytes){if(!file)return;if(file.size>maxBytes){showClientMessage(`Esse arquivo excede o limite de ${Math.floor(maxBytes/(1024*1024))} MB.`);return}const reader=new FileReader();reader.onload=()=>{lockChat();addTyping();thread.scrollTop=thread.scrollHeight;notify({action:action,filename:file.name,mime_type:file.type||"application/octet-stream",data:String(reader.result||""),event_id:eventId()})};reader.onerror=()=>showClientMessage("Não consegui ler esse arquivo.");reader.readAsDataURL(file)}
send.addEventListener("click",()=>dispatchPrompt(input.value));input.addEventListener("input",autoSize);input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();dispatchPrompt(input.value)}});attach.addEventListener("click",()=>documentFile.click());audio.addEventListener("click",()=>audioFile.click());documentFile.addEventListener("change",()=>{readFile(documentFile.files&&documentFile.files[0],"upload_document",maxDocumentBytes);documentFile.value=""});audioFile.addEventListener("change",()=>{readFile(audioFile.files&&audioFile.files[0],"upload_audio",maxAudioBytes);audioFile.value=""});document.getElementById("close").addEventListener("click",()=>notify({action:"close",event_id:eventId()}));document.getElementById("openFull").addEventListener("click",()=>notify({action:"open_full",event_id:eventId()}));window.addEventListener("message",event=>{if(event.data&&event.data.type===RENDER)render(event.data.args||{})});window.addEventListener("resize",syncFrameHeight);sendMessage(COMPONENT_READY,{apiVersion:1});window.addEventListener("load",syncFrameHeight);
</script>
</body>
</html>
